<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./main.css">
    <title>Document</title>
</head>
<body>
    <header>
        <div class="head">
            <a href="index.html"><img src="images/Group 3.svg" alt="logo"></a>
            <div class="head--text">
                <a href="index.html">Domů</a>
                <a href="sluzby.html">Služby</a>
                <a href="omne.html">O mně</a>
                <a href="#kontakt">Kontakt</a>
                
            </div>
        </div>
    </header>
<div class="form">

    <p class="h1">Stačí pouze vyplnit a já se ti ozvu!!</p>
    <form>
        <div class="forms__list">
    
    <label for="name">Jméno a příjmení</label>
    <input type="text" id="name" name="name" required>

    
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" required>

    <label for="phone">Telefonní číslo</label>
    <input type="tel" id="phone" name="phone">

    <label for="interest">O co máš zájem?</label>
    <select id="interest" name="interest" required>
        <option value="" disabled selected>Vyber možnost</option>
        <option value="coachingpremium">Coaching Premium</option>
        <option value="coaching">Coaching</option>
        <option value="diet">Jídelníček</option>
        <option value="training">Tréninkový plán</option>
    </select>

    <label for="birthdate">Datum narození</label>
    <input type="date" id="birthdate" name="birthdate">
    
    <label for="goal">Tvůj cíl</label>
    <select id="goal" name="goal" required>
        <option value="" disabled selected>Vyber cíl</option>
        <option value="muscle">Nabrat svaly</option>
        <option value="lose_weight">Zhubnout</option>
        <option value="strength">Zvýšit sílu</option>
        <option value="fitness">Zlepšit kondici</option>
    </select>
    <a href="submit"></a>

</form>
</div>
</div>

</body>
</html>
